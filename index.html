<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login  Controle de Estoque FRM</title>

    <link rel="stylesheet" href="estilos/style.css">
</head>

<body class="login-body">

    <div class="login-box">

        <h1>FRM Estoque</h1>

        <p>Faça login para continuar</p>

        <form id="loginForm">

            <label>Usuário</label>

            <input
                type="text"
                id="usuario"
                placeholder="Digite seu usuário"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <button type="submit">
                Entrar
            </button>

            <p id="mensagemLogin"></p>

        </form>

    </div>

    <script src="java/script.js"></script>

</body>

</html>
