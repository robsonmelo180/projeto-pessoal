<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Estoque FRM</title>
    <link rel="stylesheet" href="estilos/style.css">
</head>
<body>

<script>

    const usuarioLogado = localStorage.getItem("usuarioLogado");

    if (usuarioLogado !== "true") {
        window.location.href = "index.html";
    }

</script>

    <div class="form-entrada">

    <input 
        type="text" 
        id="produto" 
        placeholder="Nome do produto"
    >

    <input 
        type="number" 
        id="quantidade" 
        placeholder="Quantidade"
    >

    <button onclick="adicionarEntrada()">
        Adicionar Entrada
    </button>

    <button onclick="sair()">
    Sair
</button>

</div>
    <table>
        <thead>
            <tr>
                <th>HORA</th>
                <th>DATA</th>
                <th>QUANTIDADE DE ENTRADA</th>
                <th colspan="2">PRODUTO</th>
            </tr>
        </thead>

        <caption>ENTRADA</caption>

        <tbody id="tabelaEntradas">
            <tr>
                <td>14:08</td>
                <td>20/08/2026</td>
                <td class="num">2</td>
                <td style="width: 200px;">RETRO VERDE</td>
                <td>
            <button onclick="deletar(this)" class="butt">Deletar</button>
        </td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th colspan="2">TOTAL DE PRODUTOS</th>
                <td class="num" id="totalProdutos">0</td>
            </tr>
        </tfoot>

    </table>

    <script src="java/script.js"></script>
</body>
</html>
